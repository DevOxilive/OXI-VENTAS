services:
  - type: web
    runtime: docker
    name: oxi-ventas
    region: oregon
    plan: starter
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    disk:
      name: uploads
      mountPath: /var/www/html/storage/app
      sizeGB: 10
    envVars:
      - key: APP_NAME
        value: Super-Kay
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: oxi-ventas-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: oxi-ventas-mysql
          property: port
      - key: DB_DATABASE
        value: oxiVentas
      - key: DB_USERNAME
        value: oxi_ventas
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: oxi-ventas-mysql
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_SERVER_HOST
        value: 127.0.0.1
      - key: REVERB_SERVER_PORT
        value: "8080"
      - key: REVERB_HOST
        value: 127.0.0.1
      - key: REVERB_PORT
        value: "8080"
      - key: REVERB_SCHEME
        value: http
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: RUN_MIGRATIONS
        value: "false"

  - type: pserv
    runtime: image
    name: oxi-ventas-mysql
    region: oregon
    plan: starter
    image:
      url: docker.io/library/mysql:8.4
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: oxiVentas
      - key: MYSQL_USER
        value: oxi_ventas
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        sync: false
